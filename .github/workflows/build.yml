name: Build & Sign Android KasirQu (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

# Izin agar server GitHub boleh menyimpan file kunci (.jks) ke repositori Anda
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Buka Izin Eksekusi Gradlew
      run: chmod +x gradlew

    - name: Otomatis Buat & Simpan Keystore Permanen ke GitHub
      run: |
        if [ ! -f kasirqu.jks ]; then
          echo "Kunci permanen belum ada. Membuat kunci baru dan menyimpan ke GitHub..."
          keytool -genkey -v -keystore kasirqu.jks -alias kasir_key -keyalg RSA -keysize 2048 -validity 10000 -storepass kasirqu123 -keypass kasirqu123 -dname "CN=KasirQu, O=Kasir Pintar, C=ID"
          
          # Menyuruh bot GitHub menyimpan file .jks ini ke dalam repositori Anda selamanya
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kasirqu.jks
          git commit -m "Otomatis menyimpan kunci permanen (Keystore) [skip ci]"
          git push
        else
          echo "Kunci permanen sudah ada! Melanjutkan proses update aplikasi..."
        fi

    - name: Rakit APK & AAB Versi Release
      # Menjalankan perintah rakit APK (assembleRelease) dan AAB (bundleRelease) secara bersamaan
      run: ./gradlew assembleRelease bundleRelease

    - name: Beri Tanda Tangan (Sign) pada file APK
      run: |
        BUILD_TOOLS=$(ls -1d $ANDROID_HOME/build-tools/* | tail -n 1)
        $BUILD_TOOLS/apksigner sign --ks kasirqu.jks --ks-pass pass:kasirqu123 --key-pass pass:kasirqu123 --out KasirQu-Final.apk app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Beri Tanda Tangan (Sign) pada file AAB
      # Format AAB harus ditandatangani menggunakan jarsigner bawaan Java
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore kasirqu.jks -storepass kasirqu123 -keypass kasirqu123 app/build/outputs/bundle/release/app-release.aab kasir_key
        cp app/build/outputs/bundle/release/app-release.aab KasirQu-Final.aab

    - name: Simpan Hasil Akhir (APK & AAB)
      uses: actions/upload-artifact@v4
      with:
        name: KasirQu-Release-Files
        path: |
          KasirQu-Final.apk
          KasirQu-Final.aab
